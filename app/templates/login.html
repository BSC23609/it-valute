{% extends "base.html" %}
{% block title %}Sign in · IT Assets & Vault{% endblock %}
{% block body %}
<div class="login card">
  <img class="login-logo" src="/static/brand/group.png" alt="The Bharat Steel Group">
  <h1>IT Assets &amp; Vault</h1>
  <p class="sub">Sign in with your work email.</p>
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="f">Email</label>
    <input name="email" type="email" required autofocus autocomplete="username">
    <div style="height:12px"></div>
    <label class="f">Password</label>
    <input name="password" type="password" required autocomplete="current-password">
    <div style="height:16px"></div>
    <button class="btn" style="width:100%;justify-content:center">Sign in</button>
  </form>
</div>
{% endblock %}
