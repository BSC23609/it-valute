{% extends "base.html" %}
{% block body %}
<div class="card" style="max-width:460px">
  <h1>My account</h1>
  <p class="sub">{{ user.name }} · {{ user.email }} · role {{ user.role|upper }}</p>
  <form method="post" action="/account/password">
    <label class="f">Current password</label><input type="password" name="current" required autocomplete="current-password">
    <div style="height:10px"></div><label class="f">New password (min 8)</label><input type="password" name="new" minlength="8" required autocomplete="new-password">
    <div style="height:10px"></div><label class="f">Confirm new password</label><input type="password" name="confirm" minlength="8" required autocomplete="new-password">
    <div style="height:14px"></div><button class="btn">Change password</button>
  </form>
</div>
{% endblock %}
